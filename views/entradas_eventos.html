<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/styles.css">
  <title>Registro CGPA: Mis Entradas</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f6f9;
      color: #333;
    }
    .container {
      max-width: 1100px;
      margin: 100px auto 30px auto; 
      padding: 0 20px;
    }
    .header-seccion {
      background-color: #ffffff;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 25px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      border-left: 5px solid #b22222;
    }
    .header-seccion h2 {
      margin-top: 0;
      color: #b22222;
    }

    /* Tablas por categoría */
    .seccion-estado {
      margin-bottom: 30px;
    }
    .seccion-estado-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 1rem;
    }
    .seccion-estado-header .badge-count {
      background: rgba(255,255,255,0.85);
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 700;
    }
    .header-activa { background-color: #e8f5e9; color: #2e7d32; border-left: 4px solid #2e7d32; }
    .header-usada { background-color: #fce4ec; color: #c62828; border-left: 4px solid #c62828; }
    .header-inactiva { background-color: #f5f5f5; color: #616161; border-left: 4px solid #9e9e9e; }
    .header-anulada { background-color: #fff3e0; color: #e65100; border-left: 4px solid #e65100; }

    .tabla-entradas {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      margin-bottom: 8px;
    }
    .tabla-entradas thead {
      background: #f8f9fa;
      border-bottom: 2px solid #dee2e6;
    }
    .tabla-entradas th {
      padding: 10px 12px;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      color: #495057;
      text-align: left;
    }
    .tabla-entradas td {
      padding: 10px 12px;
      font-size: 0.88rem;
      border-bottom: 1px solid #eee;
      vertical-align: middle;
    }
    .tabla-entradas tr:last-child td { border-bottom: none; }
    .tabla-entradas tr:hover { background: #f9fbfd; }

    .badge-tipo {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: bold;
      text-transform: uppercase;
      padding: 3px 9px;
      border-radius: 12px;
    }
    .badge-estudiante { background-color: #e3f2fd; color: #1565c0; }
    .badge-apoderado { background-color: #e8f5e9; color: #2e7d32; }
    .badge-invitado { background-color: #fff3e0; color: #e65100; }

    .folio-tag { font-weight: bold; color: #b22222; font-size: 0.85rem; }

    .estado-tag {
      font-weight: bold;
      text-transform: capitalize;
      font-size: 0.82rem;
      padding: 3px 10px;
      border-radius: 12px;
      display: inline-block;
    }
    .estado-activa { background: #e8f5e9; color: #2e7d32; }
    .estado-usada { background: #fce4ec; color: #c62828; }
    .estado-inactiva { background: #f5f5f5; color: #616161; }
    .estado-anulada { background: #fff3e0; color: #e65100; }

    .btn-activar-entrada {
      background: #2e7d32;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 5px 12px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
    }
    .btn-activar-entrada:hover:not(:disabled) { background: #256628; }
    .btn-activar-entrada:disabled { opacity: 0.5; cursor: not-allowed; }

    .mensaje-info {
      text-align: center;
      padding: 40px;
      background: #ffffff;
      border-radius: 8px;
      font-size: 1rem;
      color: #666;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .seccion-vacia {
      text-align: center;
      padding: 16px;
      color: #999;
      font-size: 0.88rem;
      font-style: italic;
    }

    /* Seccion del boton enviar correo */
    .acciones-footer {
      margin-top: 35px;
      margin-bottom: 40px;
      text-align: center;
    }
    .btn-enviar-correo {
      background-color: #b22222;
      color: #ffffff;
      border: none;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(178, 34, 34, 0.25);
      transition: background-color 0.2s ease, transform 0.1s ease;
    }
    .btn-enviar-correo:hover {
      background-color: #8b0000;
    }
    .btn-enviar-correo:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
      box-shadow: none;
    }
    .mensaje-respuesta {
      margin-top: 12px;
      margin-bottom: 12px;
      font-size: 0.95rem;
      font-weight: bold;
    }
    .mensaje-exito { color: #2e7d32; }
    .mensaje-error { color: #c62828; }

    /* Responsive */
    @media screen and (max-width: 768px) {
      .container { margin-top: 70px; padding: 0 10px; }
      .tabla-entradas { font-size: 0.82rem; }
      .tabla-entradas th, .tabla-entradas td { padding: 8px 6px; }
      .tabla-entradas { display: block; overflow-x: auto; }
    }

    .branch-banner {
      display: none; /* Oculto por defecto */
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(231, 76, 60, 0.9); /* Fondo de advertencia/entorno */
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      z-index: 9999;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      pointer-events: none;
      white-space: pre-line; /* Clave para que \n funcione */
      text-align: center;    /* Centra ambos textos */
      line-height: 1.4;      /* Mejora el espaciado entre líneas */
    }

  </style>
</head>
<body>

  <div id="barra-superior">
    Mis Invitaciones Disponibles
  </div>

  <div class="container">
    <div class="header-seccion">
      <h2 id="titulo-evento">Mis Entradas</h2>
      <p>Entradas asociadas a tu grupo familiar para esta actividad.</p>
    </div>

    <!-- Boton para enviar las entradas al correo, ubicado arriba del listado -->
    <div class="acciones-footer">
      <button id="btn-enviar-correo" class="btn-enviar-correo" onclick="enviarEntradasCorreo()" disabled>
        Cargando entradas...
      </button>
      <div id="mensaje-envio" class="mensaje-respuesta"></div>
    </div>

    <div id="contenedor-entradas" class="mensaje-info">
      Cargando entradas...
    </div>
  </div>

  <div id="branchBanner" class="branch-banner"></div>

  <script>
    let userEmail = null;
    let nombres_hijos = null;
    let entradas = null;

    // Modo "Ver Acceso" del administrador: cuando la URL incluye admin_view=1
    // se muestran acciones extra (activar entradas inactivas). El acceso normal
    // del usuario nunca incluye este parametro.
    const esAdminView = new URLSearchParams(window.location.search).get('admin_view') === '1';

    const id_pagina = window.location.pathname.split('/').pop();

    // Funcion de inicializacion
    async function init() {
      if (!userEmail) {
        userEmail = await getUserEmail();
        //console.log(`user email cargado: ${userEmail}`);
      }
    }

    async function getApiKey() {
        try {
            const config_response = await fetch('/api/config');
            if (!config_response.ok) 
                return null;
            const data = await config_response.json();
            if (data && data.apiKey)
                return data.apiKey;
            return null;
        } catch (error) {
            console.error('Unexpected Error: ', error);
        }
        return null;
    }

    // Pobla nombres_hijos a partir del correo de un apoderado.
    // Se usa cuando el user_email llega por la URL (no por la sesion),
    // ya que /api/user solo entrega los hijos del usuario autenticado.
    async function cargarNombresHijosPorEmail(user_email) {
      try {
        const apiKey = await getApiKey();
        const resp = await fetch(`/api/consulta/hijos?user_email=${encodeURIComponent(user_email)}`, {
          method: 'GET',
          headers: { 'Content-Type': 'application/json', 'x-api-key': apiKey }
        });
        if (!resp.ok) {
          console.warn(`No se pudieron obtener los hijos para ${user_email}. Status: ${resp.status}`);
          return;
        }
        const familias = await resp.json();
        // familias: documentos de hermanosMap con { id, hermanos, nombre_familia, ... }
        // Aplanamos los nombres de estudiantes y los mapeamos al formato { nombre }.
        const nombres = (Array.isArray(familias) ? familias : [])
          .flatMap(fam => Array.isArray(fam.hermanos) && fam.hermanos.length
            ? fam.hermanos
            : (fam.id ? [fam.id] : []));
        const nombresUnicos = [...new Set(nombres.filter(Boolean))];
        if (nombresUnicos.length) {
          nombres_hijos = nombresUnicos.map(nombre => ({ nombre }));
        }
        //console.log(`nombres_hijos poblados desde email ${user_email}: `, nombres_hijos);
      } catch (err) {
        console.error('Error al cargar hijos por email: ', err);
      }
    }

    async function getUserEmail() {
        try {
          // 1. Intentar obtener de los parametros de la URL
          let parentSearch = '';
          try { parentSearch = window.parent.location.search; } catch(e) { parentSearch = window.location.search || ''; }
          const urlParams = new URLSearchParams(parentSearch);
          let user_email = urlParams.get('user_email');

          // Si viene en la URL y no esta vacio, lo usamos como identidad.
          // IMPORTANTE: en este caso /api/user (sesion) puede corresponder a otro
          // usuario o no traer los hijos del correo indicado, por lo que debemos
          // poblar nombres_hijos consultando la familia asociada a este correo.
          if (user_email && user_email.trim() !== '') {
              await cargarNombresHijosPorEmail(user_email.trim());
              return user_email;
          }

          // 2. Si no venia en la URL, consultamos a la API
          const response = await fetch('/api/user');
          
          if (!response.ok) {
              console.error('Usuario no autenticado');
              return null;
          }

          const user = await response.json();
          if (user && user.user) {
              const currentUser = user.user;
              user_email = currentUser.email && currentUser.email.trim() !== "" 
              ? currentUser.email 
              : null;
              if (currentUser) {
                  nombres_hijos = currentUser.hijos;
              }
              // Fallback: el documento de sesion (users) puede no tener hijos
              // propios aunque el usuario SI sea apoderado de una familia
              // (registrada por el representante en hermanosMap). En ese caso
              // poblamos nombres_hijos consultando la familia por email, igual
              // que en la rama de user_email por URL. Sin esto, un apoderado no
              // representante veia "No se encontraron entradas" en Actividades.
              if ((!nombres_hijos || !nombres_hijos.length) && user_email) {
                  await cargarNombresHijosPorEmail(user_email);
              }
              //console.log(`[/api/user] correo: ${user_email}, nombres_hijos: `, nombres_hijos);
              return user_email;
          }
        } catch (err) {
        console.error('unexpected error: ', err);
        }

        return null;
    }
   
    const ORDEN_TIPOS = {
      'estudiante': 1,
      'apoderado': 2,
      'invitado': 3
    };

    /**
     * Obtiene el valor de un parametro de la URL por su nombre
     */
    function getParametroURL(nombre) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(nombre);
    }

    /**
     * Determina el estado normalizado de una entrada
     */
    function getEstadoEntrada(entrada) {
      if (entrada.usado === true) return 'usada';
      const estado = (entrada.estado || '').toLowerCase().trim();
      if (estado === 'activa') return 'activa';
      if (estado === 'usada') return 'usada';
      if (estado === 'inactiva') return 'inactiva';
      if (estado === 'anulada') return 'anulada';
      // Default: si no tiene estado definido, se asume activa
      return estado || 'activa';
    }

    function getTextoBloques(bloques) {
      // Normalizar: el campo puede venir como string ("bloque 03") o array.
      let valor = bloques;
      if (Array.isArray(valor)) valor = valor.join(', ');
      valor = (valor == null ? '' : String(valor)).trim();

      // Sin bloque asignado todavia -> pendiente de confirmacion
      if (!valor) return 'Por Confirmar';

      // Presentacion: "bloque_03" / "bloque 03" -> "Bloque 03"
      return valor
        .replace(/_/g, ' ')
        .replace(/\bbloque\b/gi, 'Bloque');
    }
    /**
     * Renderiza una tabla de entradas para un estado especifico
     */
    function renderTablaEstado(entradasEstado, estado, config) {
      if (!entradasEstado || entradasEstado.length === 0) {
        return `
          <div class="seccion-estado">
            <div class="seccion-estado-header ${config.headerClass}">
              ${config.icono} ${config.titulo}
              <span class="badge-count">0</span>
            </div>
            <div class="seccion-vacia">No hay entradas ${config.titulo.toLowerCase()}</div>
          </div>
        `;
      }

      // Ordenar por tipo y nombre
      entradasEstado.sort((a, b) => {
        const tipoA = (a.tipo || '').toLowerCase();
        const tipoB = (b.tipo || '').toLowerCase();
        const ordenA = ORDEN_TIPOS[tipoA] || 99;
        const ordenB = ORDEN_TIPOS[tipoB] || 99;
        if (ordenA !== ordenB) return ordenA - ordenB;
        const nombreA = (a.nombre_completo || '').toLowerCase();
        const nombreB = (b.nombre_completo || '').toLowerCase();
        return nombreA.localeCompare(nombreB);
      });

      // Solo en modo admin (Ver Acceso) se agrega una columna de accion para
      // activar entradas que estan inactivas.
      const mostrarColumnaAccion = esAdminView && estado === 'inactiva';

      let filas = entradasEstado.map(entrada => {
        const tipo = (entrada.tipo || 'invitado').toLowerCase();
        const badgeClass = `badge-${tipo}`;
        const estadoDisplay = getEstadoEntrada(entrada);
        const texto_bloques = getTextoBloques(entrada.bloques);
        const folioNum = parseInt(entrada.folio) || 0;

        const celdaAccion = mostrarColumnaAccion
          ? `<td><button class="btn-activar-entrada" data-folio="${folioNum}" onclick="activarEntrada(${folioNum}, this)">Activar</button></td>`
          : '';

        return `
          <tr>
            <td><span class="badge-tipo ${badgeClass}">${entrada.tipo || 'Entrada'}</span></td>
            <td><strong>${entrada.nombre_completo || 'Sin nombre'}</strong></td>
            <td>${entrada.jornada || '—'}</td>
            <td>${texto_bloques || '—'}</td>
            <td>${entrada.curso || '—'}</td>
            <td><span class="folio-tag">#${String(entrada.folio || 0).padStart(4, '0')}</span></td>
            <td><span class="estado-tag estado-${estadoDisplay}">${estadoDisplay}</span></td>
            ${celdaAccion}
          </tr>
        `;
      }).join('');

      return `
        <div class="seccion-estado">
          <div class="seccion-estado-header ${config.headerClass}">
            ${config.icono} ${config.titulo}
            <span class="badge-count">${entradasEstado.length}</span>
          </div>
          <table class="tabla-entradas">
            <thead>
              <tr>
                <th>Tipo</th>
                <th>Nombre</th>
                <th>Jornada</th>
                <th>Bloques</th>
                <th>Curso</th>
                <th>Folio</th>
                <th>Estado</th>
                ${mostrarColumnaAccion ? '<th>Acción</th>' : ''}
              </tr>
            </thead>
            <tbody>
              ${filas}
            </tbody>
          </table>
        </div>
      `;
    }

    const id_evento = getParametroURL('id_evento');
    const id_organizacion = getParametroURL('id_organizacion');

    /**
     * Consulta el estado de pago del apoderado y calcula cuantos "pases de
     * invitado" estan cubiertos por pagos. No existe una relacion directa
     * folio->pago en el sistema; la cobertura se infiere por cantidad: las
     * primeras N entradas de invitado (ordenadas por folio) se consideran
     * cubiertas por las N invitaciones pagadas. Si la cuota CGPA esta pagada,
     * se consideran cubiertos todos los pases permitidos.
     *
     * Devuelve: { cpaPagada: bool, invitacionesPagadas: number }
     */
    async function consultarCoberturaInvitados(email) {
      const apiKey = await getApiKey();

      // Materializar pagos pendientes de reconciliar (fire-and-forget con await
      // para asegurar que /estado_pago_cpa vea los pagos recien creados).
      try {
        await fetch('/api/reconciliar_pagos?user_email=' + encodeURIComponent(email));
      } catch (e) { /* no bloquear por esto */ }

      let cpaPagada = false;
      let invitacionesPagadas = 0;

      // 1) Estado de pago del evento: pases_invitados / compromiso_maximo.
      try {
        const resEvento = await fetch(`/api/evento/estado_de_pago?id_organizacion=${encodeURIComponent(id_organizacion)}&id_evento=${encodeURIComponent(id_evento)}&user_email=${encodeURIComponent(email)}`, {
          method: 'GET',
          headers: { 'Content-Type': 'application/json', 'x-api-key': apiKey }
        });
        if (resEvento.status === 200) {
          const pagoEntradas = await resEvento.json();
          const lista = pagoEntradas && pagoEntradas['pases_invitados'];
          if (Array.isArray(lista)) {
            for (const pago of lista) {
              if (pago.compromiso_maximo_alcanzado) {
                cpaPagada = true;
              }
              // Cantidad de pases cubiertos por este pago.
              const cantidad = Number(pago.cantidad) || 0;
              const porCompromiso = Number(pago.pases_por_compromiso) || 1;
              invitacionesPagadas += Math.max(0, Math.floor(cantidad * porCompromiso));
            }
          }
        }
      } catch (e) {
        console.warn('No se pudo consultar estado_de_pago del evento:', e);
      }

      // 2) Estado de pago CPA/heuristica de invitaciones sueltas (monto 5000).
      try {
        const resCpa = await fetch('/api/estado_pago_cpa?user_email=' + encodeURIComponent(email));
        const pagos = await resCpa.json();
        if (Array.isArray(pagos)) {
          if (pagos.some(p => p.cuota_cpa === true || p.tipo === 'cuota_cpa')) {
            cpaPagada = true;
          }
          if (!cpaPagada) {
            pagos.forEach(p => {
              const tipo = (p.tipo || '').toLowerCase();
              const subtipo = (p.subtipo || '').toLowerCase();
              const esInvitacion = tipo.includes('invitacion') || tipo.includes('fiesta') ||
                subtipo.includes('invitacion') || subtipo.includes('fiesta') || subtipo.includes('adicional');
              const esPagoInvitacionPorMonto = (p.payment_method === 'flow' || p.payment_method === 'mercadopago')
                && p.monto === 5000 && !p.cuota_cpa;
              if (esInvitacion || esPagoInvitacionPorMonto) {
                invitacionesPagadas += 1;
              }
            });
          }
        }
      } catch (e) {
        console.warn('No se pudo consultar estado_pago_cpa:', e);
      }

      return { cpaPagada, invitacionesPagadas };
    }

    /**
     * Determina si el folio (entrada de tipo invitado) esta cubierto por pago.
     * Si la cuota CGPA esta pagada, todos los invitados estan cubiertos. En caso
     * contrario, se cubren los primeros N invitados por orden de folio, donde
     * N = invitacionesPagadas.
     */
    function entradaInvitadoEstaPagada(folio, cobertura) {
      if (cobertura.cpaPagada) return true;
      const invitados = (Array.isArray(entradas) ? entradas : [])
        .filter(e => (e.tipo || '').toLowerCase() === 'invitado')
        .sort((a, b) => (parseInt(a.folio) || 0) - (parseInt(b.folio) || 0));
      const idx = invitados.findIndex(e => (parseInt(e.folio) || 0) === (parseInt(folio) || 0));
      if (idx === -1) return false;
      return idx < (cobertura.invitacionesPagadas || 0);
    }

    /**
     * Activa una entrada inactiva por su folio. Solo disponible en modo admin
     * (Ver Acceso, admin_view=1). Antes de activar consulta si la entrada esta
     * pagada y lo informa en la confirmacion. El admin puede activar de todos
     * modos. La autorizacion real la valida el backend contra la sesion del
     * administrador.
     */
    async function activarEntrada(folio, btn) {
      if (!esAdminView) return;
      if (!folio) {
        alert('Folio inválido para activar la entrada.');
        return;
      }

      const textoOriginal = btn ? btn.textContent : 'Activar';
      if (btn) { btn.disabled = true; btn.textContent = 'Verificando pago...'; }

      // Determinar el tipo de la entrada a activar.
      const entradaActual = (Array.isArray(entradas) ? entradas : [])
        .find(e => (parseInt(e.folio) || 0) === (parseInt(folio) || 0));
      const tipoEntrada = (entradaActual?.tipo || '').toLowerCase();

      try {
        await init(); // asegura que userEmail este cargado (correo del apoderado)

        // Verificar estado de pago. La cobertura por pago aplica a invitados;
        // para estudiantes/apoderados no hay cobro de invitacion, se informa asi.
        let mensajePago = '';
        if (tipoEntrada === 'invitado') {
          const cobertura = await consultarCoberturaInvitados(userEmail);
          const pagada = entradaInvitadoEstaPagada(folio, cobertura);
          mensajePago = pagada
            ? '\n\n✅ Esta invitación figura como PAGADA.'
            : '\n\n⚠️ Esta invitación NO figura como pagada. Si continúa, se activará de todos modos.';
        }

        if (btn) { btn.disabled = false; btn.textContent = textoOriginal; }

        if (!confirm(`¿Activar la entrada con folio #${String(folio).padStart(4, '0')}?${mensajePago}`)) {
          return;
        }

        if (btn) { btn.disabled = true; btn.textContent = 'Activando...'; }
        const apiKey = await getApiKey();

        const resp = await fetch('/api/entrada/activar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-api-key': apiKey },
          body: JSON.stringify({
            id_organizacion,
            id_evento,
            folio,
            user_email: userEmail,
            admin_view: true
          })
        });

        const data = await resp.json();
        if (resp.ok && (data.status === 'updated' || data.status === 'ok')) {
          // Recargar la lista para reflejar el nuevo estado.
          cargarEntradasUsuario();
        } else {
          alert('No se pudo activar la entrada: ' + (data.error || 'error desconocido'));
          if (btn) { btn.disabled = false; btn.textContent = textoOriginal; }
        }
      } catch (err) {
        console.error('Error al activar entrada:', err);
        alert('Error de conexión al activar la entrada.');
        if (btn) { btn.disabled = false; btn.textContent = textoOriginal; }
      }
    }

    /**
     * Activa en lote las entradas INACTIVAS del propio usuario al entrar al
     * menu ACTIVIDADES. Usa el mismo endpoint que el boton "Activar", pero
     * sin folio: en ese caso el backend activa todas las entradas inactivas
     * de la familia del usuario (estudiantes y apoderados/invitados segun
     * corresponda). Los invitados se activan si la familia tiene la cuota CGPA
     * pagada. Autorizada por el backend para el propio usuario
     * (user_email === sessionEmail) o para un admin/supervisor que emula el
     * acceso (admin_view=1).
     *
     * Es best-effort: si falla, no se interrumpe la carga de entradas.
     */
    async function activarEntradasInactivasUsuario() {
      // Funciona para el propio usuario y tambien cuando un admin/supervisor
      // emula el acceso (admin_view=1): en ese caso el backend autoriza la
      // activacion en lote sobre el user_email indicado.
      if (!userEmail || !id_organizacion || !id_evento) return;

      try {
        const apiKey = await getApiKey();
        const resp = await fetch('/api/entrada/activar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-api-key': apiKey },
          body: JSON.stringify({
            id_organizacion,
            id_evento,
            user_email: userEmail,
            admin_view: esAdminView
          })
        });
        const data = await resp.json().catch(() => ({}));
        if (resp.ok) {
          if (data.activadas) {
            console.log(`Entradas inactivas activadas automaticamente: ${data.activadas}`);
          }
        } else {
          console.warn('No se pudieron activar automaticamente las entradas inactivas: ', data.error || resp.status);
        }
      } catch (err) {
        console.error('Error al activar automaticamente las entradas inactivas: ', err);
      }
    }

    async function validar_hermanos(hijos) {
      const apiKey = await getApiKey();
      console.log('Api Key obtenida: ', apiKey);
      const estudiantes = hijos.map(hijo => hijo.nombre);

      //console.log(`Validando relación de estudiantes para la organización ${id_organizacion} y los hijos: `, estudiantes);

      const query = new URLSearchParams({
        id_organizacion: id_organizacion,
        estudiantes: JSON.stringify(estudiantes)
      });
      console.log(`Consultando relación de estudiantes para la organización ${id_organizacion} y los hijos: `, estudiantes);
      const result = await fetch(`/api/consulta/estudiantes/relacion?${query.toString()}`, {
        method: 'GET',
        headers: { 'Content-Type': 'application/json', 'x-api-key': apiKey }
      });
      if ( result.status === 200 ) {
        const response = await result.json();
        //console.log(`Relación de estudiantes ${JSON.stringify(estudiantes)}: `, response);
        if (response.length > 1) {
          console.warn(`Hubo un problema. Intentelo mas tarde. Si el problema persiste, por favor, contacte al administrador.`);
          return false; // Hay duplicado
        } else {
          return true;
        }
      } else {
        const error_msg = await result.json();
        console.log(`Error al consultar relación de estudiantes. Status: ${result.status}, Error: ${JSON.stringify(error_msg)}`);
      }
      console.warn(`Hubo un problema. Intentelo mas tarde. Si el problema persiste, por favor, contacte al administrador.`);
      return false;
    }

    function ocultarBotonCorreo() {
      const btnCorreo = document.getElementById('btn-enviar-correo');
      if (btnCorreo) btnCorreo.style.display = 'none';
    }

    async function cargarEntradasUsuario() {
      // Ejecutar inicializacion al cargar el script
      await init();

      const contenedor = document.getElementById('contenedor-entradas');
      const tituloHeader = document.getElementById('titulo-evento');

      // Se habilita el envio por correo SOLO si hay entradas activas. Se define
      // aqui para poder respetar el estado del boton en el bloque finally.
      let hayEntradasActivas = false;
      
      if (!nombres_hijos || !nombres_hijos.length ) {
          contenedor.className = 'mensaje-info';
          contenedor.innerHTML = '<p>No se encontraron entradas disponibles para esta actividad.</p>';
          ocultarBotonCorreo();
          return;
      }

      if (await validar_hermanos(nombres_hijos) === false) {
        const apiKey = await getApiKey();
        console.log(`User email: ${userEmail}, id_organizacion: ${id_organizacion}, id_evento: ${id_evento}`);
          fetch('/api/report/problem', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'x-api-key': apiKey },
            body: JSON.stringify({
              id_organizacion,
              user_email: userEmail,
              issue_type: 'familias_sin_mergear',
              problemDescription: `Se requiere mergear las familias y eliminar las entradas extras para invitados.`
            })
          });
          contenedor.className = 'mensaje-info';
          contenedor.innerHTML = '<p>Se produjo un problema leyendo las entradas. Intentelo mas tarde. Si el problema persiste, por favor, contacte al administrador.</p>';
          alert('Se produjo un problema leyendo las entradas. Intentelo mas tarde. Si el problema persiste, por favor, contacte al administrador.');
          ocultarBotonCorreo();
          return;
      }

      // 1. Obtener el id_evento de la URL
      if (id_evento) {
        const tituloFormateado = id_evento.replace(/_/g, ' ').toUpperCase();
        tituloHeader.textContent = `Entradas: ${tituloFormateado}`;
      }

      try {
        // Al entrar al menu ACTIVIDADES, activar automaticamente las entradas
        // inactivas del usuario (mismo backend que el boton "Activar", en lote).
        // Se hace antes de leer las entradas para que ya vengan activadas.
        await activarEntradasInactivasUsuario();

        let entradas_todas = await obtenerEntradasFamilia(nombres_hijos[0].nombre);
        //console.log(`Entradas obtenidas: `, entradas_todas, `\nCantidad: ${entradas_todas.length}`);

        if (!Array.isArray(entradas_todas) || entradas_todas.length === 0) {
          const featureOptions = await getFeatureOptions('generar_entradas');
          if (featureOptions && featureOptions.enabled) {
            // Generar entradas
            await generarEntradasFamilia(nombres_hijos[0].nombre);
            // Obtener las entradas después de generarlas
            entradas_todas = await obtenerEntradasFamilia(nombres_hijos[0].nombre);
          }
        }

        // Ya NO filtramos por estado - mostramos todas separadas por categoria
        entradas = entradas_todas;

        //console.log('Entradas encontradas: ', entradas.length);
        

        if (!Array.isArray(entradas) || entradas.length === 0) {
          controlarBotonEnviarCorreo(false); // Deshabilitar boton si no hay entradas
          contenedor.className = 'mensaje-info';
          contenedor.innerHTML = '<p>No se encontraron entradas disponibles para esta actividad.</p>';
          return;
        }

        // Agrupar entradas por estado
        const grupos = {
          activa: [],
          usada: [],
          inactiva: [],
          anulada: []
        };

        entradas.forEach(entrada => {
          const estado = getEstadoEntrada(entrada);
          if (grupos[estado]) {
            grupos[estado].push(entrada);
          } else {
            // Si hay un estado desconocido, lo ponemos en inactiva
            grupos.inactiva.push(entrada);
          }
        });

        // Solo se pueden enviar por correo si hay entradas ACTIVAS. Las
        // inactivas se muestran pero no habilitan el envio.
        hayEntradasActivas = grupos.activa.length > 0;
        if (hayEntradasActivas) {
          controlarBotonEnviarCorreo(true); // Habilitar boton si hay entradas activas
        } else {
          controlarBotonEnviarCorreo(false); // Deshabilitar boton si no hay entradas activas
        }
        
        // Configuracion visual de cada seccion
        const configSecciones = {
          activa: { titulo: 'Activas', icono: '✅', headerClass: 'header-activa' },
          usada: { titulo: 'Usadas', icono: '🎟️', headerClass: 'header-usada' },
          inactiva: { titulo: 'Inactivas', icono: '⏸️', headerClass: 'header-inactiva' },
          anulada: { titulo: 'Anuladas', icono: '❌', headerClass: 'header-anulada' }
        };

        // Renderizar tablas por categoria
        let html = '';
        // Por Implementar: Leer desde la base de datos la configuracion de las tarjetas que se renderizan.
        const renderizar = {
          activa: true,
          usada: true,
          inactiva: true,
          anulada: false
        };
        ['activa', 'usada', 'inactiva', 'anulada'].forEach(estado => {
          if (renderizar[estado]) {
            html += renderTablaEstado(grupos[estado], estado, configSecciones[estado]);
          }
        });

        contenedor.className = '';
        contenedor.innerHTML = html;

      } catch (error) {
        console.error('Error al cargar entradas:', error);
        contenedor.className = 'mensaje-info';
        contenedor.innerHTML = '<p>Ocurrio un error al cargar las entradas de la actividad.</p>';
      } finally {
        // Terminada la carga, restaurar el texto del boton. Solo se HABILITA si
        // hay entradas activas; si solo hay inactivas/usadas queda deshabilitado
        // (respetando lo definido por controlarBotonEnviarCorreo).
        const btnCorreo = document.getElementById('btn-enviar-correo');
        if (btnCorreo) {
          btnCorreo.textContent = 'Enviar entradas al correo';
          if (hayEntradasActivas) {
            btnCorreo.disabled = false;
            btnCorreo.style.opacity = '1';
            btnCorreo.style.cursor = 'pointer';
            btnCorreo.title = '';
          } else {
            btnCorreo.disabled = true;
            btnCorreo.style.opacity = '0.5';
            btnCorreo.style.cursor = 'not-allowed';
            btnCorreo.title = 'Solo puede enviar entradas activas';
          }
        }
      }
    }

    /**
     * Envia las entradas asociadas al email del usuario
     */
    async function enviarEntradasCorreo() {
      const btn = document.getElementById('btn-enviar-correo');
      const mensajeDiv = document.getElementById('mensaje-envio');

      // No enviar si las entradas aún se están cargando
      if (btn && btn.disabled) {
        return;
      }

      // No enviar si no hay entradas cargadas
      if (!Array.isArray(entradas) || entradas.length === 0) {
        mensajeDiv.className = 'mensaje-respuesta mensaje-error';
        mensajeDiv.textContent = 'No hay entradas disponibles para enviar.';
        return;
      }

      await init();

      if (!userEmail) {
        mensajeDiv.className = 'mensaje-respuesta mensaje-error';
        mensajeDiv.textContent = 'No se encontro una direccion de correo valida para enviar.';
        return;
      }

      try {
        btn.disabled = true;
        btn.textContent = 'Enviando entradas...';
        mensajeDiv.textContent = '';

        const apiKey = await getApiKey();

        const id_evento = getParametroURL('id_evento');
        const id_organizacion = getParametroURL('id_organizacion');

        const resp_correo_tipo = await fetch(`/api/correo_tipo?id_organizacion=${encodeURIComponent(id_organizacion)}&id_evento=${encodeURIComponent(id_evento)}`, {
          method: 'GET',
          headers: {
            'Content-Type': 'application/json',
            'x-api-key': apiKey
          }
        });

        const { asuntoCorreo, mensajeCorreo, tipo_attachment } = await resp_correo_tipo.json();

        // const asuntoCorreo = ' prueba de envio de entradas por correo';
        // const mensajeCorreo = `Entradas`;
        // const tipo_attachment = 'pdf';

        // Solo enviar entradas activas por correo
        const entradasActivas = (entradas || []).filter(e => getEstadoEntrada(e) === 'activa');

        const response = await fetch('/api/entradas/send_email', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-api-key': apiKey
          },
          body: JSON.stringify({ email_destinatario: userEmail, asuntoCorreo, mensajeCorreo, tickets: entradasActivas, save_file: false, tipo_attachment})
        });

        const data = await response.json();

        if (response.ok) {
          mensajeDiv.className = 'mensaje-respuesta mensaje-exito';
          mensajeDiv.textContent = 'Entradas enviadas con éxito a tu correo!';
        } else {
          mensajeDiv.className = 'mensaje-respuesta mensaje-error';
          mensajeDiv.textContent = data.error || 'Ocurrio un error al intentar enviar el correo.';
        }
      } catch (error) {
        console.error('Error al enviar correo:', error);
        mensajeDiv.className = 'mensaje-respuesta mensaje-error';
        mensajeDiv.textContent = 'Ocurrio un error al conectar con el servidor.';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Enviar entradas al correo';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      // Verificar si ya se ejecutó en este ciclo de navegación
      if (paginaInicializada()) {
        //console.log('Carga ya procesada previamente en este iframe, omitiendo duplicado.');
        return;
      }

      console.log('DOM cargado, iniciando carga de entradas...');
      cargarEntradasUsuario();
      controlarBotonEnviarCorreo(false); // Inicialmente deshabilitado, se habilitará según la configuración de feature
    });

    function paginaInicializada(paginaId = id_pagina) {
      try {
        if (window.top && window.top[paginaId]) {
          //console.log('Carga ya procesada previamente en este iframe, omitiendo duplicado.');
          return true;
        }
        window.top[paginaId] = true;
      } catch (e) {
        return window.top[paginaId] === true;
      }
      return false;
    }

    // Limpieza de la bandera anti-duplicados. Se usa 'pagehide' ademas de
    // 'beforeunload' porque en navegadores moviles 'beforeunload' no se dispara
    // de forma fiable al reasignar el src de un iframe; si la bandera queda
    // "pegada", la proxima visita en movil abortaria la inicializacion y no se
    // activarian las entradas inactivas.
    function limpiarBanderaPagina() {
      try {
        if (window.top) {
          delete window.top[id_pagina];
        }
      } catch (e) {
        delete window.top[id_pagina];
      }
    }
    window.addEventListener('beforeunload', limpiarBanderaPagina);
    window.addEventListener('pagehide', limpiarBanderaPagina);

    async function getFeatureOptions(feature) {
      try {
        let response = null;
        if (Array.isArray(feature)) {
          response = await fetch(`/api/feature/options?id_organizacion=${encodeURIComponent(id_organizacion)}&id_pagina=${encodeURIComponent(id_pagina)}&features=${encodeURIComponent(feature.join(','))}&default=false`);
        } else {
          response = await fetch(`/api/feature/options?id_organizacion=${encodeURIComponent(id_organizacion)}&id_pagina=${encodeURIComponent(id_pagina)}&feature=${encodeURIComponent(feature)}&default=false`);
        }
        if (!response.ok) {
          throw new Error('Error al consultar /api/feature/options');
        }
        const featureOptions = await response.json();
        return featureOptions;
      } catch (error) {
        console.error('Error al obtener opciones de feature:', error);
        return null;
      }
    }

    async function obtenerEntradasFamilia(nombre_completo) {
      try {
        const apiKey = await getApiKey();

        const result_entradas = await fetch('/api/entrada/activar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-api-key': apiKey },
          body: JSON.stringify({ id_organizacion, id_evento, user_email: userEmail, admin_view: esAdminView })
        });

        const response = await fetch(`/api/entrada/familia?id_organizacion=${encodeURIComponent(id_organizacion)}&id_evento=${encodeURIComponent(id_evento)}&nombre_completo=${encodeURIComponent(nombre_completo)}`, {
          method: 'GET',
          headers: {
            'Content-Type': 'application/json',
            'x-api-key': apiKey
          }
        });

        if (!response.ok) {
          throw new Error('No se pudieron obtener las entradas.');
        }

        const entradas = await response.json();

        return entradas;
      } catch (error) {
        console.error('Error al obtener entradas de la familia:', error);
        return null;
      }
    }

    async function generarEntradasFamilia(nombre_completo) {
      try {
        const apiKey = await getApiKey();
        const evento_result = await fetch(`/api/eventos/buscar?id_evento=${encodeURIComponent(id_evento)}`, {
          method: 'GET',
          headers: { 'Content-Type': 'application/json', 'x-api-key': apiKey }
        });

        // Obteniendo la informacion del evento para generar las entradas
        const eventoInfo = await evento_result.json();
        const curso_bloques = eventoInfo.cursoBloqueMap;
        const imagen_ticket_path = eventoInfo.imagen_ticket_path;

        //console.log('Información del evento obtenida:', eventoInfo);
        //console.log('Nombre completo para generar entradas:', nombre_completo);

        //Reporting la generacion de entradas para la familia
        post_issue_to_db(userEmail, 'generacion_entradas', `Se generaron entradas para la familia del usuario ${userEmail} con hijo de nombre completo: ${nombre_completo}`);
        // Generando entradas para la familia
        const result = await fetch('/api/entradas/generar/familia', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-api-key': apiKey },
          body: JSON.stringify({
            id_organizacion,
            id_evento,
            nombre_completo,
            imagen_ticket_path,
            curso_bloques,
            save_file: false
          })
        });
        const entradas = await result.json();
        //console.log('Entradas generadas para la familia:', entradas);
        return entradas;
      } catch (error) {
        console.error('Error al generar entradas:', error);
        return null;
      }
    }

    async function controlarBotonEnviarCorreo(enable = false) {
      try {
        const feature = 'enviar_entradas_correo';
        const response = await fetch(`/api/feature/options?id_organizacion=${encodeURIComponent(id_organizacion)}&id_pagina=${encodeURIComponent(id_pagina)}&feature=${encodeURIComponent(feature)}&default=false`);
        //const response = await fetch('/api/feature/options');
        if (!response.ok) {
          throw new Error('Error al consultar /api/feature/options');
        }
        
        // Obtenemos las opciones habilitadas desde la API
        const features = await response.json();
        //const features = { enviar_entradas_correo: false }; // Simulamos la respuesta de la API para este ejemplo
        //console.log('Features obtenidos:', features);
        const btnCorreo = document.getElementById('btn-enviar-correo');
        
        if (btnCorreo) {
          // Validamos la propiedad configurada en la API (ej: enviar_entradas_correo o similar)
          if ((features.feature === feature && features.enabled === false) || !enable) {
            btnCorreo.disabled = true;
            btnCorreo.style.opacity = '0.5';
            btnCorreo.style.cursor = 'not-allowed';
            btnCorreo.title = 'Opción deshabilitada temporalmente';
          } else {
            btnCorreo.disabled = false;
            btnCorreo.style.opacity = '1';
            btnCorreo.style.cursor = 'pointer';
            btnCorreo.title = '';
          }
        }
      } catch (error) {
        console.error('Error al verificar feature de envío de correo:', error);
      }
    }

  async function verificarBranch() {
    try {
      const [resCurrent, resProd, resDatabaseName] = await Promise.all([
        fetch('/api/branch/current'),
        fetch('/api/branch/produccion'),
        fetch('/api/consulta/database/name') 
      ]);

      if (!resCurrent.ok || !resProd.ok || !resDatabaseName.ok) return;

      const { currentBranch } = await resCurrent.json();
      const { productionBranch } = await resProd.json();
      const { currentDatabaseName } = await resDatabaseName.json();

      // Si los branches son válidos y distintos de producción, mostrar el banner
      if (currentBranch && productionBranch && currentBranch !== productionBranch) {
        const banner = document.getElementById('branchBanner');
        banner.textContent = `Entorno de Pruebas: ${currentBranch}\nBase de Datos: ${currentDatabaseName}`;
        banner.style.display = 'block';
      }
    } catch (err) {
      console.error('Error al obtener la información del branch:', err);
    }
  }

  // Ejecutar la verificación al cargar la página
  verificarBranch();
