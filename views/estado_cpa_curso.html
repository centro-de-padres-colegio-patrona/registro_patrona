<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estado CGPA por Curso</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: #f8f9fa;
      padding: 20px;
      color: #333;
    }
    h2 {
      font-size: 1.2rem;
      font-weight: 700;
      color: #2c3e50;
      margin-bottom: 16px;
    }
    .filtros {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      align-items: flex-end;
    }
    .filtro-grupo {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .filtro-grupo label {
      font-size: 0.75rem;
      font-weight: 700;
      color: #888;
      text-transform: uppercase;
    }
    .filtro-grupo select {
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 0.9rem;
      min-width: 150px;
    }
    .resumen {
      display: flex;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .resumen-card {
      background: white;
      border-radius: 10px;
      padding: 16px 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      text-align: center;
      min-width: 140px;
    }
    .resumen-card .valor {
      font-size: 1.8rem;
      font-weight: 800;
    }
    .resumen-card .etiqueta {
      font-size: 0.75rem;
      color: #888;
      text-transform: uppercase;
      margin-top: 4px;
    }
    .resumen-card.pagado .valor { color: #2ecc71; }
    .resumen-card.pendiente .valor { color: #e74c3c; }
    .resumen-card.total .valor { color: #3498db; }

    .table-container {
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }
    th {
      background: #f1f4f9;
      padding: 12px 14px;
      text-align: left;
      font-size: 0.75rem;
      font-weight: 700;
      color: #666;
      text-transform: uppercase;
    }
    td {
      padding: 10px 14px;
      border-bottom: 1px solid #f0f0f0;
    }
    tr:hover { background: #f8fbff; }

    .badge-pagado {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 700;
      background: #e8f5e9;
      color: #2e7d32;
    }
    .badge-pendiente {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 700;
      background: #ffebee;
      color: #c62828;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #888;
      font-size: 0.9rem;
    }

    @media (max-width: 600px) {
      .filtros { flex-direction: column; }
      .resumen { flex-direction: column; }
      .resumen-card { width: 100%; }
    }
  </style>
</head>
<body>

<h2>Estado Cuota CGPA por Curso</h2>

<div class="filtros" id="filtros-container" style="display:none;">
  <div class="filtro-grupo">
    <label>Curso</label>
    <select id="filtro-curso" onchange="cargarEstadoCPA()">
      <option value="">— Seleccionar curso —</option>
    </select>
  </div>
  <div class="filtro-grupo">
    <label>Sección</label>
    <select id="filtro-seccion" onchange="cargarEstadoCPA()">
      <option value="">— Seleccionar Sección —</option>
      <option value="A">A</option>
      <option value="B">B</option>
    </select>
  </div>
</div>

<div class="resumen" id="resumen-container" style="display:none;">
  <div class="resumen-card total">
    <div class="valor" id="total-alumnos">0</div>
    <div class="etiqueta">Total Alumnos</div>
  </div>
  <div class="resumen-card pagado">
    <div class="valor" id="total-pagados">0</div>
    <div class="etiqueta">CGPA Pagado</div>
  </div>
  <div class="resumen-card pendiente">
    <div class="valor" id="total-pendientes">0</div>
    <div class="etiqueta">CGPA Pendiente</div>
  </div>
</div>

<div id="loading" class="loading" style="display:none;">⏳ Cargando datos...</div>

<div class="table-container" id="tabla-container" style="display:none;">
  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>Alumno</th>
        <th>Bloque</th>
        <th>Color</th>
        <th>Curso</th>
        <th>Apoderado</th>
        <th>Estado CGPA</th>
        <th id="th-accion" style="display:none;">Acción</th>
      </tr>
    </thead>
    <tbody id="tabla-estado-cpa">
    </tbody>
  </table>
</div>

<div id="mensaje-vacio" style="display:none; text-align:center; padding:40px; color:#888;">
  Selecciona un curso para ver el estado de pagos CGPA.
</div>

<script>
  // Variable global para saber si el usuario puede editar el estado CPA
  let _puedeEditarCPA = false;

  // Cache del mapa curso -> {bloque, color} obtenido de /api/cursos-bloque
  let cursosBloqueCache = null;

  // Mapeo de código de color a color real (hex) para el dot.
  // Reutiliza los mismos códigos que el mantenedor de Cursos/Bloque.
  const colorMap = {
    'ama_m': '#FFD700', 'ama_t': '#FFD700', 'roj': '#E74C3C', 'nar': '#FF8C00',
    'azul': '#2196F3', 'ros_m': '#FF69B4', 'ros_t': '#FF69B4', 'morado': '#8E44AD',
    'rosado': '#FF69B4', 'dorado': '#FFD700', 'negro': '#2C3E50', 'gris': '#95A5A6',
    'verde': '#27AE60', 'amarillo': '#F1C40F', 'rojo': '#E74C3C', 'naranja': '#FF8C00',
  };

  const colorGlosa = {
    'ama_m': 'Amarillo', 'ama_t': 'Amarillo', 'roj': 'Rojo', 'nar': 'Naranjo',
    'azul': 'Azul', 'ros_m': 'Rosado', 'ros_t': 'Rosado', 'morado': 'Morado',
    'rosado': 'Rosado', 'dorado': 'Dorado', 'negro': 'Negro', 'gris': 'Gris',
    'verde': 'Verde', 'amarillo': 'Amarillo', 'rojo': 'Rojo', 'naranja': 'Naranja',
  };

  function getColorReal(codigo) {
    return colorMap[codigo] || codigo || '#95A5A6';
  }

  function getColorNombre(codigo) {
    return colorGlosa[codigo] || codigo || '';
  }

  // Presenta el bloque legible: "bloque_03" / "bloque 03" -> "Bloque 03"
  function formatearBloque(valor) {
    valor = (valor == null ? '' : String(valor)).trim();
    if (!valor) return '';
    return valor.replace(/_/g, ' ').replace(/\bbloque\b/gi, 'Bloque');
  }

  // Índice bloque (normalizado) -> código de color, construido desde /api/cursos-bloque.
  let colorPorBloqueCache = null;

  // Normaliza el nombre de un bloque para usarlo como clave: "Bloque 06" -> "bloque_06"
  function normalizarBloque(valor) {
    return (valor == null ? '' : String(valor)).trim().toLowerCase().replace(/\s+/g, '_');
  }

  // Carga (una sola vez) el mapa de cursos y construye el índice bloque -> color.
  async function cargarMapaCursosBloque() {
    if (colorPorBloqueCache) return colorPorBloqueCache;
    try {
      const res = await fetch('/api/cursos-bloque');
      const cursosData = await res.json();
      colorPorBloqueCache = {};
      (Array.isArray(cursosData) ? cursosData : []).forEach(c => {
        if (c && c.bloque) {
          colorPorBloqueCache[normalizarBloque(c.bloque)] = c.color || '';
        }
      });
    } catch (err) {
      console.error('Error cargando /api/cursos-bloque:', err);
      colorPorBloqueCache = {};
    }
    return colorPorBloqueCache;
  }

  // Devuelve el código de color asociado a un bloque (o '' si no se encuentra).
  function getColorDeBloque(bloque) {
    const mapa = colorPorBloqueCache || {};
    return mapa[normalizarBloque(bloque)] || '';
  }

  const params = new URLSearchParams(window.location.search);
  const userEmail = params.get('user_email') || '';

  const cursos = [
    'Prekínder', 'Kínder',
    '1° Básico', '2° Básico', '3° Básico', '4° Básico',
    '5° Básico', '6° Básico', '7° Básico', '8° Básico',
    'I° Medio', 'II° Medio', 'III° Medio', 'IV° Medio'
  ];

  // Llenar select de cursos
  const selectCurso = document.getElementById('filtro-curso');
  cursos.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c;
    opt.textContent = c;
    selectCurso.appendChild(opt);
  });

  // Mostrar mensaje inicial
  document.getElementById('mensaje-vacio').style.display = 'block';

  // Auto-cargar curso asignado del presidente
  async function initCursoPresidente() {
    if (!userEmail) {
      // Sin email, mostrar filtros
      document.getElementById('filtros-container').style.display = 'flex';
      return;
    }
    try {
      const res = await fetch(`/api/mi-perfil?email=${encodeURIComponent(userEmail)}`);
      if (!res.ok) {
        document.getElementById('filtros-container').style.display = 'flex';
        return;
      }
      const perfil = await res.json();

      // Si tiene curso_asignado (es presidente), auto-cargar sin mostrar filtros
      if (perfil.curso_asignado) {
        const partes = perfil.curso_asignado.split(' - ');
        const cursoAsignado = partes[0] || '';
        const seccionAsignada = partes[1] || '';

        // Verificar si también es admin o supervisor para habilitar edición
        const esAdmin = (perfil.roles || []).includes('administrador');
        const esSupervisor = (perfil.roles || []).includes('supervisor');
        if (esAdmin || esSupervisor) {
          _puedeEditarCPA = true;
        }

        if (cursoAsignado) {
          document.querySelector('h2').textContent = `Estado Cuota CGPA — ${cursoAsignado} ${seccionAsignada}`;
          document.getElementById('filtro-curso').value = cursoAsignado;
          document.getElementById('filtro-seccion').value = seccionAsignada;
          cargarEstadoCPA();
          return;
        }
      }

      // Si es presidente pero sin curso asignado, mostrar mensaje
      const esPresidente = (perfil.roles || []).includes('presidente');
      if (esPresidente && !perfil.curso_asignado) {
        document.getElementById('mensaje-vacio').style.display = 'block';
        document.getElementById('mensaje-vacio').innerHTML = '<p style="font-size:1.1rem; color:#e65100; font-weight:700;">⚠️ No tienes curso asignado.</p><p style="margin-top:8px; color:#666;">Solicítalo al administrador.</p>';
        return;
      }

      // Si es administrador o supervisor, mostrar filtros para seleccionar curso
      const esAdmin = (perfil.roles || []).includes('administrador');
      const esSupervisor = (perfil.roles || []).includes('supervisor');
      if (esAdmin || esSupervisor) {
        _puedeEditarCPA = true;
        document.getElementById('filtros-container').style.display = 'flex';
        return;
      }

      // Si no tiene rol presidente, administrador ni supervisor, no tiene acceso
      document.getElementById('mensaje-vacio').style.display = 'block';
      document.getElementById('mensaje-vacio').innerHTML = '<p style="font-size:1.1rem; color:#c62828; font-weight:700;">🚫 No tienes permisos para ver esta sección.</p><p style="margin-top:8px; color:#666;">Esta página es exclusiva para presidentes de curso.</p>';
    } catch (err) {
      console.error('[initCursoPresidente] Error:', err);
      document.getElementById('filtros-container').style.display = 'flex';
    }
  }

  initCursoPresidente();

  async function cargarEstadoCPA() {
    const curso = document.getElementById('filtro-curso').value;
    const seccion = document.getElementById('filtro-seccion').value;

    if (!curso || !seccion) {
      document.getElementById('mensaje-vacio').style.display = 'block';
      document.getElementById('mensaje-vacio').textContent = 'Selecciona un curso y sección para ver el estado de pagos CGPA.';
      document.getElementById('tabla-container').style.display = 'none';
      document.getElementById('resumen-container').style.display = 'none';
      return;
    }

    document.getElementById('mensaje-vacio').style.display = 'none';
    document.getElementById('loading').style.display = 'block';
    document.getElementById('tabla-container').style.display = 'none';
    document.getElementById('resumen-container').style.display = 'none';

    try {
      let url = `/api/estado_cpa_curso?curso=${encodeURIComponent(curso)}`;
      if (seccion) url += `&seccion=${encodeURIComponent(seccion)}`;

      // Cargar en paralelo el estado CPA y el índice bloque -> color
      const [res] = await Promise.all([
        fetch(url),
        cargarMapaCursosBloque()
      ]);
      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.error || 'Error al consultar');
      }

      renderTabla(data);
    } catch (err) {
      console.error('[estado_cpa_curso] Error:', err);
      document.getElementById('loading').style.display = 'none';
      document.getElementById('mensaje-vacio').style.display = 'block';
      document.getElementById('mensaje-vacio').textContent = 'Error al cargar datos: ' + err.message;
    }
  }

  // Genera un dot de color (círculo) para un código de color de bloque.
  function dotColor(colorCodigo) {
    const colorReal = getColorReal(colorCodigo);
    const colorNombre = getColorNombre(colorCodigo);
    return `<span style="display:inline-block; width:14px; height:14px; border-radius:50%; background:${colorReal}; border:1px solid rgba(0,0,0,0.15); vertical-align:middle;" title="${colorNombre}"></span>`;
  }

  // A partir de la cadena de bloques del alumno (ej. "bloque_02/bloque_04"),
  // devuelve { bloquesHtml, coloresHtml }. Vacío -> "----" en ambas columnas.
  function construirCeldasBloque(bloquesStr) {
    const lista = (bloquesStr == null ? '' : String(bloquesStr))
      .split(/[\/,]/).map(b => b.trim()).filter(Boolean);

    if (lista.length === 0) {
      return { bloquesHtml: '----', coloresHtml: '----' };
    }

    const bloquesHtml = lista.map(b => formatearBloque(b)).join('/');
    const coloresHtml = `<span style="display:inline-flex; gap:5px; align-items:center; justify-content:center;">`
      + lista.map(b => dotColor(getColorDeBloque(b))).join('')
      + `</span>`;

    return { bloquesHtml, coloresHtml };
  }

  function renderTabla(alumnos) {
    const tbody = document.getElementById('tabla-estado-cpa');
    tbody.innerHTML = '';

    const totalAlumnos = alumnos.length;
    const pagados = alumnos.filter(a => a.cpa_pagado).length;
    const pendientes = totalAlumnos - pagados;

    // Actualizar resumen
    document.getElementById('total-alumnos').textContent = totalAlumnos;
    document.getElementById('total-pagados').textContent = pagados;
    document.getElementById('total-pendientes').textContent = pendientes;

    // Mostrar columna de acción si tiene permisos
    if (_puedeEditarCPA) {
      document.getElementById('th-accion').style.display = '';
    }

    // Renderizar filas
    alumnos.forEach((alumno, idx) => {
      const row = document.createElement('tr');
      const estadoBadge = alumno.cpa_pagado
        ? '<span class="badge-pagado">Pagado</span>'
        : '<span class="badge-pendiente">Pendiente</span>';

      const botonAccion = _puedeEditarCPA
        ? `<td><button onclick="toggleEstadoCPA('${(alumno.apoderado_email || '').replace(/'/g, "\\'")}', ${!alumno.cpa_pagado}, this, '${(alumno.nombre || '').replace(/'/g, "\\'")}')" style="padding:4px 12px; border:none; border-radius:5px; font-size:0.78rem; font-weight:700; cursor:pointer; ${alumno.cpa_pagado ? 'background:#ffebee; color:#c62828;' : 'background:#e8f5e9; color:#2e7d32;'}">${alumno.cpa_pagado ? 'Marcar Pendiente' : 'Marcar Pagado'}</button></td>`
        : '';

      // Bloques y colores del grupo familiar del alumno (desde sus entradas).
      // Si aún no está registrado por su grupo familiar, ambas columnas van con "----".
      const { bloquesHtml, coloresHtml } = construirCeldasBloque(alumno.bloques);

      row.innerHTML = `
        <td>${idx + 1}</td>
        <td>${alumno.nombre || '—'}</td>
        <td>${bloquesHtml}</td>
        <td style="text-align:center;">${coloresHtml}</td>
        <td>${alumno.curso || ''} ${alumno.seccion || ''}</td>
        <td>${alumno.apoderado || '—'}</td>
        <td>${estadoBadge}</td>
        ${botonAccion}
      `;
      tbody.appendChild(row);
    });

    document.getElementById('loading').style.display = 'none';
    document.getElementById('resumen-container').style.display = 'flex';
    document.getElementById('tabla-container').style.display = 'block';
  }

  async function toggleEstadoCPA(apoderadoEmail, nuevoCpaPagado, btn, nombreAlumno) {
    const mensaje = nuevoCpaPagado 
      ? '¿Está seguro que desea marcar como pagado el CGPA?' 
      : '¿Está seguro que desea marcar como pendiente el CGPA?';
    if (!confirm(mensaje)) return;

    btn.disabled = true;
    btn.textContent = '...';
    try {
      let res;
      if (apoderadoEmail) {
        // Actualizar por email del apoderado (afecta a todos sus hijos)
        res = await fetch('/api/actualizar_cuota_cpa', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: apoderadoEmail, cuota_cpa: nuevoCpaPagado })
        });
      } else {
        // Sin apoderado registrado: actualizar directamente por nombre del alumno
        res = await fetch('/api/actualizar_cuota_cpa_alumno', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nombre_alumno: nombreAlumno, cuota_cpa: nuevoCpaPagado })
        });
      }
      const data = await res.json();
      if (res.ok) {
        // Actualizar solo la fila sin recargar todo
        const row = btn.closest('tr');
        const estadoTd = row.querySelector('td:nth-last-child(2)');
        if (nuevoCpaPagado) {
          estadoTd.innerHTML = '<span class="badge-pagado">Pagado</span>';
          btn.textContent = 'Marcar Pendiente';
          btn.style.background = '#ffebee';
          btn.style.color = '#c62828';
          btn.onclick = function() { toggleEstadoCPA(apoderadoEmail, false, btn, nombreAlumno); };
        } else {
          estadoTd.innerHTML = '<span class="badge-pendiente">Pendiente</span>';
          btn.textContent = 'Marcar Pagado';
          btn.style.background = '#e8f5e9';
          btn.style.color = '#2e7d32';
          btn.onclick = function() { toggleEstadoCPA(apoderadoEmail, true, btn, nombreAlumno); };
        }
        btn.disabled = false;

        // Actualizar contadores del resumen
        const totalAlumnos = parseInt(document.getElementById('total-alumnos').textContent);
        const pagadosActual = parseInt(document.getElementById('total-pagados').textContent);
        document.getElementById('total-pagados').textContent = nuevoCpaPagado ? pagadosActual + 1 : pagadosActual - 1;
        document.getElementById('total-pendientes').textContent = nuevoCpaPagado ? totalAlumnos - pagadosActual - 1 : totalAlumnos - pagadosActual + 1;
      } else {
        alert('Error: ' + (data.error || 'No se pudo actualizar'));
        btn.disabled = false;
        btn.textContent = nuevoCpaPagado ? 'Marcar Pagado' : 'Marcar Pendiente';
      }
    } catch (err) {
      alert('Error de conexión');
      btn.disabled = false;
      btn.textContent = nuevoCpaPagado ? 'Marcar Pagado' : 'Marcar Pendiente';
    }
  }
</script>

</body>
</html>
