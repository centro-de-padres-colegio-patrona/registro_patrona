<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validar QR</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<div class="page-title">🔍 Validar QR de Entrada</div>

<!-- Tarjeta 1: Escáner QR -->
<div class="card">
  <h3>Escáner de código QR</h3>

  <div id="visor-camara">
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
    <div class="scan-overlay">
      <div class="scan-frame"></div>
      <div class="scan-line"></div>
    </div>
  </div>

  <button class="btn-principal" id="btn-iniciar" style="display:none;" onclick="iniciarEscaneo()">
    📷 Abrir cámara y escanear
  </button>

  <button class="btn-detener" id="btn-detener" onclick="detenerEscaneo()">
    ⏹ Detener cámara
  </button>

  <p class="estado-msg" id="estado">Apunte la cámara al código QR...</p>
  
</div>


<!-- Tarjeta 2: Búsqueda manual -->
<div class="card">
    <h3>Buscar por RUT, apellido o nombre</h3>
    <div class="search-bar">
        <input type="text" id="inp-busqueda" placeholder="Ej: Pérez, 12.345.678, González..." onkeydown="if(event.key==='Enter')buscar()">
        <button onclick="buscar()">🔍 Buscar</button>
    </div>
    <p class="search-hint">Busca por RUT del apoderado, RUT del estudiante, apellido paterno o materno, o nombre</p>
</div>


<div class="resultado-card" id="resultado-card">
  <h3 id="resultado-titulo">QR Detectado</h3>
  <div class="resultado-contenido" id="resultado-contenido"></div>
  <button class="btn-principal" style="margin-top:16px;" onclick="iniciarEscaneo()">
    🔄 Escanear otro
  </button>
</div>

<!-- Librería jsQR para decodificar QR desde canvas -->
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

<script>

  let videoStream = null;
  let animationId = null;
  let escaneando = false;
  
  let userEmail = null;

  // Función de inicialización
  async function init() {
    userEmail = await getUserEmail();
    console.log(`user email cargado: ${userEmail}`);
  }

  // Ejecutar inicialización al cargar el script
  init();

  async function getUserEmail() {
    try {
      // 1. Intentar obtener de los parámetros de la URL
      const urlParams = new URLSearchParams(window.parent.location.search);
      let user_email = urlParams.get('user_email');
      console.log(`user_email: ${user_email}`);

      // Si viene en la URL y no está vacío, lo retornamos inmediatamente
      if (user_email && user_email.trim() !== '') {
        return user_email;
      }

      // 2. Si no venía en la URL, consultamos a la API esperando la respuesta con await
      const response = await fetch('/api/user');
      
      if (!response.ok) {
        console.error('Usuario no autenticado');
        return null;
      }

      const user = await response.json();
      
      if (user && user.user) {
        const currentUser = user.user;
        user_email = currentUser.email && currentUser.email.trim() !== "" 
          ? currentUser.email 
          : null;

        console.log(`[/api/user] correo: ${user_email}`);
        return user_email;
      }

    } catch (err) {
      console.error('unexpected error: ', err);
    }

    return null;
  }

  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  async function iniciarEscaneo() {
    const visor = document.getElementById('visor-camara');
    const btnIniciar = document.getElementById('btn-iniciar');
    const btnDetener = document.getElementById('btn-detener');
    const estado = document.getElementById('estado');
    const resultadoCard = document.getElementById('resultado-card');

    resultadoCard.style.display = 'none';

    try {
      // Solicitar acceso a la cámara trasera (ideal para móvil)
      videoStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 640 } }
      });

      video.srcObject = videoStream;
      video.setAttribute('playsinline', true);
      await video.play();

      visor.style.display = 'block';
      btnIniciar.style.display = 'none';
      btnDetener.style.display = 'block';
      estado.textContent = 'Apunte la cámara al código QR...';
      escaneando = true;

      escanearFrame();

    } catch (err) {
      console.error('Error accediendo a la cámara:', err);
      estado.textContent = '❌ No se pudo acceder a la cámara. Verifique los permisos.';
      estado.style.color = '#e74c3c';
    }
  }

  function escanearFrame() {
    if (!escaneando) return;

    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(imageData.data, imageData.width, imageData.height, {
        inversionAttempts: 'dontInvert'
      });

      if (code) {
        // QR detectado
        escaneando = false;
        detenerEscaneo();
        procesarQR(code.data);
        return;
      }
    }

    animationId = requestAnimationFrame(escanearFrame);
  }

  function detenerEscaneo() {
    escaneando = false;
    if (animationId) {
      cancelAnimationFrame(animationId);
      animationId = null;
    }
    if (videoStream) {
      videoStream.getTracks().forEach(track => track.stop());
      videoStream = null;
    }

    const visor = document.getElementById('visor-camara');
    const btnIniciar = document.getElementById('btn-iniciar');
    const btnDetener = document.getElementById('btn-detener');
    const estado = document.getElementById('estado');

    visor.style.display = 'none';
    btnIniciar.style.display = 'block';
    btnDetener.style.display = 'none';
    estado.textContent = 'Cámara detenida.';
    estado.style.color = '#888';
  }

  function procesarQR(data) {
    const resultadoCard = document.getElementById('resultado-card');
    const resultadoTitulo = document.getElementById('resultado-titulo');
    const resultadoContenido = document.getElementById('resultado-contenido');
    const estado = document.getElementById('estado');

    estado.textContent = '✅ QR detectado';
    estado.style.color = '#2ecc71';

    // Intentar parsear como URL con parámetros de entrada
    try {
      console.log(`procesarQR: ${data}`);
      const url = new URL(data);
      const params = url.searchParams;

      if (params.has('familia') || params.has('folio')) {
        // Es un QR de entrada válido
        const id_organizacion = params.get('organizacion') || '';
        const id_evento = params.get('evento') || '';
        const familia = params.get('familia') || '—';
        const jornada = params.get('jornada') || '—';
        const tipo = params.get('tipo') || '—';
        const folio = params.get('folio') || '—';
        const nombre = params.get('nombre') || familia;
        const curso = params.get('curso') || '—';
        const bloques = params.get('bloques') || '—';
        const numListado = params.get('num_listado') || '—';
        const total = params.get('total') || '—';

        const jornadaMap = { 'manana': 'Mañana', 'tarde': 'Tarde' };
        const jornadaDisplay = jornadaMap[jornada] || jornada;
        const serial = String(folio).padStart(4, '0');

        // Consultar estado del ticket en BD
      fetch(`/api/config?email=${encodeURIComponent(userEmail)}`)
      .then ( res => res.json() )
      .then ( async config_json => {
        fetch(`/api/entrada/familia?tipo_output=json&id_organizacion=${encodeURIComponent(id_organizacion)}&id_evento=${encodeURIComponent(id_evento)}&familia=${encodeURIComponent(familia)}`,{
          method: 'GET',
          headers: {
            'Content-Type': 'application/json',
            'x-api-key': config_json.apiKey
          }
        })
          .then(res => res.json())
          .then(infoTickets => {
            console.log('familia:', familia);
            console.log('infoTickets:', infoTickets);
            const info = infoTickets[0] || {};
            if (info.usado || info.estado != 'activa') {
              // TICKET YA FUE USADO
              resultadoCard.className = 'resultado-card error';
              resultadoTitulo.textContent = '⚠ ENTRADA YA UTILIZADA';
              resultadoContenido.innerHTML = `
                <div style="background:#fef2f2; border:2px solid #e74c3c; border-radius:8px; padding:16px; margin-bottom:14px; text-align:center;">
                  <p style="font-size:1.1rem; font-weight:700; color:#e74c3c; margin:0 0 8px 0;">🚫 Este ticket ya fue escaneado</p>
                  <p style="font-size:0.85rem; color:#666; margin:0;">Validado por: <strong>${info.validado_por || '—'}</strong></p>
                  <p style="font-size:0.85rem; color:#666; margin:4px 0 0 0;">Fecha: <strong>${info.fecha_uso ? new Date(info.fecha_uso).toLocaleString('es-CL') : '—'}</strong></p>
                </div>
                <div class="dato-row"><span class="dato-label">Tipo</span><span class="dato-value">${tipo}</span></div>
                <div class="dato-row"><span class="dato-label">Familia</span><span class="dato-value">${familia}</span></div>
                <div class="dato-row"><span class="dato-label">Nombre</span><span class="dato-value">${nombre}</span></div>
                <div class="dato-row"><span class="dato-label">N° Entrada</span><span class="dato-value">${serial}</span></div>
              `;
            } else {
              // TICKET VÁLIDO — mostrar datos y botón VALIDAR QR
              resultadoCard.className = 'resultado-card';
              resultadoTitulo.textContent = '✅ Entrada válida';
              resultadoContenido.innerHTML = `
                <div class="dato-row"><span class="dato-label">Tipo</span><span class="dato-value">${tipo}</span></div>
                <div class="dato-row"><span class="dato-label">Familia</span><span class="dato-value">${familia}</span></div>
                <div class="dato-row"><span class="dato-label">Nombre</span><span class="dato-value">${nombre}</span></div>
                <div class="dato-row"><span class="dato-label">Jornada</span><span class="dato-value">${jornadaDisplay}</span></div>
                <div class="dato-row"><span class="dato-label">Bloque</span><span class="dato-value">${bloques}</span></div>
                <div class="dato-row"><span class="dato-label">Curso</span><span class="dato-value">${curso}</span></div>
                <div class="dato-row"><span class="dato-label">N° Listado</span><span class="dato-value">${numListado}</span></div>
                <div class="dato-row"><span class="dato-label">N° Entrada</span><span class="dato-value">${serial}</span></div>
                <div class="dato-row"><span class="dato-label">Total Entradas</span><span class="dato-value">${total}</span></div>
              `;
            }
            resultadoCard.style.display = 'block';
          })
          .catch(err => {
            // Si la consulta falla, mostrar datos del QR sin estado BD
            resultadoCard.className = 'resultado-card';
            resultadoTitulo.textContent = '✅ Entrada (sin verificar en BD)';
            resultadoContenido.innerHTML = `
              <div class="dato-row"><span class="dato-label">Tipo</span><span class="dato-value">${tipo}</span></div>
              <div class="dato-row"><span class="dato-label">Familia</span><span class="dato-value">${familia}</span></div>
              <div class="dato-row"><span class="dato-label">Nombre</span><span class="dato-value">${nombre}</span></div>
              <div class="dato-row"><span class="dato-label">Jornada</span><span class="dato-value">${jornadaDisplay}</span></div>
              <div class="dato-row"><span class="dato-label">N° Entrada</span><span class="dato-value">${serial}</span></div>
            `;
            resultadoCard.style.display = 'block';
          });
        })
      .catch( err => {
        console.error(`User ${userEmail} has not access rights`);
      });

      } else {
        // URL válida pero no es entrada
        resultadoCard.className = 'resultado-card error';
        resultadoTitulo.textContent = '⚠ QR no reconocido';
        resultadoContenido.innerHTML = `<p>URL detectada pero no corresponde a una entrada:</p><p style="margin-top:8px; word-break:break-all; color:#666;">${data}</p>`;
        resultadoCard.style.display = 'block';
      }
    } catch (e) {
      // No es una URL — mostrar texto crudo
      resultadoCard.className = 'resultado-card error';
      resultadoTitulo.textContent = '⚠ QR no es una entrada';
      resultadoContenido.innerHTML = `<p>Contenido del QR:</p><p style="margin-top:8px; word-break:break-all; color:#666;">${data}</p>`;
      resultadoCard.style.display = 'block';
    }
  }

</script>

</body>
</html>
